<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Расскажите о вашем продукте · PRODIGI AGENCY</title>
    <meta name="description" content="Бриф Promo Experience от Prodigi Agency" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23B6F36B'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="/css/app.css" />
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#view">Перейти к анкете</a>
    <header class="topbar">
      <div class="topbar__inner">
        <a class="wordmark" href="/" aria-label="PRODIGI AGENCY">
          <span id="brand-name">PRODIGI</span>
          <span class="wordmark__suffix" id="brand-suffix">AGENCY</span>
        </a>
        <span class="topbar__product" id="brand-product">Бриф Promo Experience</span>
        <div class="topbar__right">
          <span class="saved" id="saved" role="status" aria-live="polite"></span>
          <span class="topbar__step" id="progress-text" hidden></span>
          <div id="lang"></div>
        </div>
      </div>
      <div
        class="progress"
        id="progress"
        role="progressbar"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
        hidden
      >
        <span class="progress__fill" id="progress-fill"></span>
      </div>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
    <noscript>
      <p class="noscript">Для заполнения брифа включите JavaScript в браузере.</p>
    </noscript>
  </body>
</html>
